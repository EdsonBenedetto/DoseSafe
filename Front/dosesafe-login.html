<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoseSafe - Acesso ao Sistema</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --success: #059669;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --focus-ring: rgba(2, 132, 199, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
      animation: fadeIn 0.4s ease-out;
    }

    .brand-container {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-svg {
      width: 100%;
      max-width: 280px;
      height: auto;
      margin: 0 auto;
      display: block;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 16px;
      color: var(--text-main);
      background-color: #f8fafc;
      transition: all 0.2s ease;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--primary);
      background-color: #ffffff;
      box-shadow: 0 0 0 4px var(--focus-ring);
    }

    .btn-login {
      margin-top: 8px;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--success) 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .btn-badge-scan {
      padding: 12px;
      background-color: transparent;
      border: 1.5px dashed var(--primary);
      color: var(--primary);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s ease;
    }

    .btn-badge-scan:hover {
      background-color: #f0f9ff;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      margin: 4px 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }

    .divider span {
      padding: 0 10px;
    }

    .footer-info {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    .form-group input.invalid {
      border-color: #ef4444;
    }

    .error-text {
      font-size: 12px;
      color: #ef4444;
      display: none;
    }

    .error-text.show {
      display: block;
    }

    .demo-hint {
      background-color: #f0f9ff;
      border: 1px dashed var(--primary);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
    }

    .demo-hint b {
      color: var(--text-main);
    }

    .btn-demo {
      padding: 14px;
      background-color: #fff;
      border: 1.5px solid var(--success);
      color: var(--success);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s ease;
    }

    .btn-demo:hover {
      background-color: #f0fdf4;
    }

    .success-panel {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      padding: 12px 0 4px;
      animation: fadeIn 0.4s ease-out;
    }

    .success-panel.show {
      display: flex;
    }

    .success-panel .check-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--success) 0%, #34d399 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .success-panel h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
    }

    .success-panel p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .success-panel .btn-login {
      width: 100%;
      margin-top: 8px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
<script src="auth.js"></script>
</head>
<body>

  <main class="login-card">
    <div class="brand-container">
      <svg class="brand-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120">
        <defs>
          <linearGradient id="doseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7" />
            <stop offset="100%" stop-color="#059669" />
          </linearGradient>
          <linearGradient id="checkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10B981" />
            <stop offset="100%" stop-color="#34D399" />
          </linearGradient>
          <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.15" />
          </filter>
        </defs>
        <g transform="translate(15, 10)" filter="url(#softShadow)">
          <path d="M 50 5 C 75 5, 90 25, 90 55 C 90 80, 70 98, 50 98 C 30 98, 10 80, 10 55 C 10 25, 25 5, 50 5 Z" fill="url(#doseGradient)" />
          <path d="M 50 12 C 70 12, 82 28, 82 55 C 82 75, 66 90, 50 90 C 34 90, 18 75, 18 55 C 18 28, 30 12, 50 12 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.3" />
          <path d="M 33 52 L 45 64 L 68 38" fill="none" stroke="url(#checkGradient)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
        </g>
        <g transform="translate(130, 72)">
          <text x="0" y="0" font-family="sans-serif" font-weight="800" font-size="46" fill="#0F172A" letter-spacing="-1">Dose</text>
          <text x="112" y="0" font-family="sans-serif" font-weight="400" font-size="46" fill="#059669" letter-spacing="-0.5">Safe</text>
          <text x="2" y="22" font-family="sans-serif" font-weight="600" font-size="12" fill="#64748B" letter-spacing="2.5">CLINICAL SAFETY SYSTEM</text>
        </g>
      </svg>
    </div>

    <form class="login-form" id="loginForm">
      <button type="button" class="btn-demo" id="btnDemo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 3v4M3 5h4M6 17v4M4 19h4M13 3l1.9 4.3L19 9l-4.1 1.7L13 15l-1.9-4.3L7 9l4.1-1.7L13 3Z"></path>
        </svg>
        Entrar em Modo Demonstração
      </button>

      <div class="demo-hint">
        Administrador: <b>admin</b> / <b>admin</b><br>Enfermeira: <b>1001</b> / <b>1234</b> · Médico: <b>CRM55512</b> / <b>1234</b>
      </div>

      <button type="button" class="btn-badge-scan" id="btnBadge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
          <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
          <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
          <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
          <rect x="7" y="7" width="10" height="10" rx="1"></rect>
        </svg>
        Bipar Crachá do Profissional
      </button>

      <div class="divider">
        <span>OU DIGITE OS DADOS</span>
      </div>

      <div class="form-group">
        <label for="matricula">Matrícula / Coren / CRM</label>
        <input type="text" id="matricula" placeholder="Ex: 123456-AM" required autocomplete="off">
        <span class="error-text" id="errMatricula">Matrícula não encontrada.</span>
      </div>

      <div class="form-group">
        <label for="senha">Senha de Acesso</label>
        <input type="password" id="senha" placeholder="••••••••" required>
        <span class="error-text" id="errSenha">Senha incorreta.</span>
      </div>

      <button type="submit" class="btn-login">ACESSAR SISTEMA</button>
    </form>

    <div class="success-panel" id="successPanel">
      <div class="check-circle">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5"></path>
        </svg>
      </div>
      <h2 id="successNome">Acesso liberado</h2>
      <p id="successCargo">Bem-vindo(a) ao DoseSafe</p>
      <button type="button" class="btn-login" id="btnSair">Sair do modo demonstração</button>
    </div>

    <div class="footer-info">
      <p>Unidade Hospitalar v1.0.4 • Check-in Seguro</p>
    </div>
  </main>

<script>
  const form = document.getElementById("loginForm");
  const matriculaInput = document.getElementById("matricula");
  const senhaInput = document.getElementById("senha");
  const errMatricula = document.getElementById("errMatricula");
  const errSenha = document.getElementById("errSenha");

  function clearErrors() {
    matriculaInput.classList.remove("invalid");
    senhaInput.classList.remove("invalid");
    errMatricula.classList.remove("show");
    errSenha.classList.remove("show");
  }
  function tryLogin(m, s) {
    clearErrors();
    const r = DS.login(m, s);
    if (r.ok) { location.href = "inicio.html"; return; }
    if (r.err === "senha") {
      senhaInput.classList.add("invalid"); errSenha.classList.add("show"); senhaInput.focus();
    } else {
      errMatricula.textContent = r.err === "inativo" ? "Funcionário desativado. Fale com o administrador." : "Matrícula não encontrada.";
      matriculaInput.classList.add("invalid"); errMatricula.classList.add("show"); matriculaInput.focus();
    }
  }
  form.addEventListener("submit", e => { e.preventDefault(); tryLogin(matriculaInput.value, senhaInput.value); });
  document.getElementById("btnDemo").addEventListener("click", () => tryLogin("admin", "admin"));
  document.getElementById("btnBadge").addEventListener("click", () => {
    alert("Leitor de crachá (NFC) não está disponível neste dispositivo.\nDigite matrícula e senha.");
  });
</script>

</body>
</html>
